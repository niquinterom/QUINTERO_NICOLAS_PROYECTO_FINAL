<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/tipografia.css">
    <link rel="stylesheet" href="css/cajas.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>



<body>
    <!-- =========================================================
       1. ENCABEZADO Y NAVEGACIÓN PRINCIPAL
       ========================================================= -->

    <header class="cabecera">
        <nav class="menu">
            <ul class="menu__lista">
                <li><a class="menu__enlace" href="index.html">Inicio</a></li>
                <li><a class="menu__enlace" href="carta.html">Carta</a></li>
                <li><a class="menu__enlace menu__enlace--activo" href="reservas.html">Reservas</a></li>
                <li><a class="menu__enlace" href="sedes.html">sedes</a></li>
            </ul>
        </nav>
        <p> ¡Llena los siguientes datos para apartar tu lugar.¡ </p>


    </header>

    <!-- =========================================================
       2. CONTENIDO PRINCIPAL 
========================================================= -->


    <form class="formulario-reserva" action="#" method="POST">


        <fieldset>
            <legend>Tus datos</legend>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
            <br><br>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Ej. 320 123 4567" required>
            <br><br>

            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" placeholder="tu@correo.com" required>
        </fieldset>

        <br>


        <fieldset>
            <legend>Detalles de la mesa</legend>

            <label for="fecha">Fecha de visita:</label>
            <input type="date" id="fecha" name="fecha" required>
            <br><br>

            <label for="personas">Cantidad de personas:</label>
            <select id="personas" name="personas" required>
                <option value="" disabled selected>Elige una opción</option>
                <option value="1">1 persona</option>
                <option value="2">2 personas</option>
                <option value="4">4 personas</option>
                <option value="grupo">Grupo (más de 4)</option>
            </select>
            <br><br>


            <p>¿Dónde prefieres sentarte?</p>

            <input type="radio" id="interior" name="zona" value="interior" required>
            <label for="interior">Salón interior (con aire acondicionado)</label>
            <br>

            <input type="radio" id="terraza" name="zona" value="terraza">
            <label for="terraza">Terraza al aire libre</label>
            <br>

            <input type="radio" id="barra" name="zona" value="barra">
            <label for="barra">Cerca de la barra de café</label>
        </fieldset>

        <br>


        <fieldset>
            <legend>Notas extra</legend>

            <label for="notas">¿Algún pedido o comentario especial?</label>
            <br>
            <textarea id="notas" name="notas" rows="4" cols="35"
                placeholder="Ej. Es un cumpleaños, prefiero leche deslactosada, etc."></textarea>
            <br><br>


            <input type="checkbox" id="confirmar" name="confirmar" required>
            <label for="confirmar">Confirmo que los datos son correctos</label>
        </fieldset>

        <br>

        <button class="formulario-reserva__boton" type="submit">Reservar mesa</button>
        <button class="formulario-reserva__boton formulario-reserva__boton--secundario" type="reset">Borrar
            todo</button>

    </form>

    <hr>

    <!-- =========================================================
       3. PIE DE PÁGINA 
       ========================================================= -->
    <footer class="pie-pagina">
        <p>CAFETERIA ALTIPLANO</p>
        <ul>
            <li>Términos y condiciones</li>
            <li>Políticas de privacidad</li>
            <li>Contactos</li>
        </ul>
    </footer>

</body>

</html>
